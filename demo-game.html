<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo Alex | Demo</title>
  <style>
    :root { --accent: #55e6c1; --accent-2: #ffc857; --bg: #08111f; --panel: rgba(15, 27, 45, .88); --line: rgba(148, 163, 184, .2); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f8fafc; font: 16px/1.5 Georgia, 'Times New Roman', serif; background: radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 35%), linear-gradient(145deg, #08111f, #111827 65%, #0a1724); }
    .shell { width: min(1060px, calc(100% - 32px)); margin: auto; padding: 28px 0 44px; }
    header, section { border: 1px solid var(--line); background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.22); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 24px; border-radius: 24px; border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .kicker { margin: 0; color: var(--accent); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; } h1 { margin-bottom: 6px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; color: var(--accent-2); } h2 { margin-bottom: 8px; font-size: 1.45rem; }
    .balance { min-width: 150px; padding: 12px 16px; border-radius: 14px; background: rgba(0,0,0,.22); text-align: right; } .balance span { display: block; color: #a8b6c8; font: 10px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; } .balance strong { color: var(--accent); font: 700 1.35rem Arial, sans-serif; }
    main { display: grid; grid-template-columns: 1.35fr .8fr; gap: 18px; margin-top: 18px; } section { padding: 24px; border-radius: 24px; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0; } .tile { position: relative; overflow: hidden; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 16px; background-size: cover; background-position: center; color: #fff7d6; font: 900 clamp(.68rem, 2.4vw, 1rem)/1.1 Arial, sans-serif; letter-spacing: .1em; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.9); box-shadow: inset 0 -12px 24px rgba(0,0,0,.14); transition: transform .2s ease, box-shadow .2s ease; }
    .tile::after { content: ''; position: absolute; inset: 0; pointer-events: none; border: 1px solid rgba(255,255,255,.14); border-radius: inherit; background: linear-gradient(135deg, rgba(255,255,255,.12), transparent 45%, rgba(0,0,0,.22)); }
    .board-frame { position: relative; }
    .board-shine { position: absolute; inset: 0; pointer-events: none; border-radius: 16px; background: linear-gradient(115deg, transparent 40%, color-mix(in srgb, var(--accent-2) 20%, transparent) 50%, transparent 60%); background-size: 260% 260%; animation: shineSweep 5s ease-in-out infinite; }
    @keyframes shineSweep { 0% { background-position: 120% 0%; } 50% { background-position: -20% 100%; } 100% { background-position: 120% 0%; } }
    .tile.idle-float { animation: tileFloat 3.6s ease-in-out infinite; } .tile.idle-float:nth-child(2) { animation-delay: .2s; } .tile.idle-float:nth-child(3) { animation-delay: .4s; }
    @keyframes tileFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .tile.spinning { animation: tileSpin .12s linear infinite; filter: blur(1.5px); }
    @keyframes tileSpin { 0% { transform: translateY(-4px) scale(.96); } 50% { transform: translateY(3px) scale(1.02); } 100% { transform: translateY(-4px) scale(.96); } }
    .tile.landing { animation: tileLand .45s cubic-bezier(.17,.89,.32,1.49); }
    @keyframes tileLand { 0% { transform: translateY(-18px) scale(.85); opacity: .4; } 60% { transform: translateY(3px) scale(1.06); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    .tile.win { box-shadow: 0 0 0 2px var(--accent-2), 0 0 22px color-mix(in srgb, var(--accent-2) 65%, transparent); animation: tileWinPulse .6s ease-in-out 2; }
    @keyframes tileWinPulse { 0%, 100% { transform: scale(1.04); } 50% { transform: scale(1.14); } }
    .coin-particle { position: absolute; font-size: 1.3rem; pointer-events: none; will-change: transform, opacity; animation: coinBurst .9s ease-out forwards; }
    @keyframes coinBurst { 0% { transform: translate(0, 0) scale(.6) rotate(0deg); opacity: 1; } 100% { transform: var(--fly, translate(0, -70px)) scale(1) rotate(160deg); opacity: 0; } }
    .bigwin-overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; pointer-events: none; }
    .bigwin-overlay.show { display: flex; }
    .bigwin-flash { position: absolute; inset: 0; background: radial-gradient(circle, color-mix(in srgb, var(--accent-2) 45%, transparent), transparent 65%); animation: bigWinFlash 1.4s ease-in-out infinite; }
    @keyframes bigWinFlash { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .bigwin-text { position: relative; text-align: center; animation: bigWinPop .55s cubic-bezier(.17,.89,.32,1.49); text-shadow: 0 0 24px color-mix(in srgb, var(--accent-2) 70%, transparent); }
    @keyframes bigWinPop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    #muteToggle { border: 1px solid var(--line); background: rgba(255,255,255,.08); color: #f8fafc; border-radius: 12px; width: 44px; height: 44px; font-size: 1.1rem; cursor: pointer; margin-right: 10px; }
    @media (prefers-reduced-motion: reduce) { .tile, .board-shine, .bigwin-flash, .bigwin-text, .coin-particle { animation: none !important; } }
    @media (max-width: 720px) { header { align-items: flex-start; flex-direction: column; } .balance { text-align: left; } main { grid-template-columns: 1fr; } section { padding: 18px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><div><p class="kicker">Jogo Alex · demonstração</p><h1 id="title">Demo</h1><p id="tagline">Uma experiência original para explorar.</p></div><div style="display:flex; align-items:center;"><button id="muteToggle" type="button" aria-label="Ativar ou desativar som">🔊</button><div class="balance"><span>Saldo fictício</span><strong id="balance">R$ 250,00</strong></div></div></header>
    <main><section><p class="kicker">Rodada rápida</p><h2 id="boardTitle">Prepare sua jogada</h2><div class="board-frame"><div class="board-shine"></div><div class="board" id="board"></div></div><div class="controls"><button id="play">Jogar demo</button><button class="secondary" id="betDown">− Aposta</button><button class="secondary" id="betUp">+ Aposta</button><span id="bet">Aposta: R$ 5,00</span></div><div class="result" id="result">Escolha uma jogada para começar.</div></section><section><p class="kicker">Como funciona</p><h2 id="mode">Modo demo</h2><ul class="rules" id="rules"></ul><a class="back" href="index.html">← Voltar ao catálogo</a></section></main>
  </div>
  <div id="fxLayer" style="position:fixed; inset:0; z-index:40; overflow:hidden; pointer-events:none;"></div>
  <div id="bigWinOverlay" class="bigwin-overlay"><div class="bigwin-flash"></div><div class="bigwin-text"><p class="kicker">Jogo Alex</p><h2 style="font-size:3rem; margin:6px 0; color:var(--accent-2);">GRANDE VITÓRIA</h2><p id="bigWinAmount" style="font-size:1.6rem; font-weight:700;">R$ 0,00</p></div></div>
  <script>
    const games = {
      'neon-dice': { title: 'Neon Dice', tagline: 'Dois dados, uma combinação elétrica.', mode: 'Duelo de dados', icons: ['DADO 1','DADO 2','7','DIAMANTE'], rules: ['Lance dois dados neon.', 'Duplas pagam até 4x a aposta.', 'O 7 dourado paga 7x.'], play() { const a = Math.floor(Math.random()*6)+1; const b = Math.floor(Math.random()*6)+1; return { tiles: [`DADO ${a}`, `DADO ${b}`, a+b === 7 ? 'SETE' : 'PULSO'], text: a+b === 7 ? 'Sete dourado! Vitória de 7x.' : a === b ? 'Dupla neon! Vitória de 4x.' : 'A combinação não fechou nesta rodada.', multiplier: a+b === 7 ? 7 : a === b ? 4 : 0 }; } },
      'moon-crash': { title: 'Moon Crash', tagline: 'Suba até a lua antes da queda.', mode: 'Multiplicador crescente', icons: ['ROCKET','MOON','COMET','STAR'], rules: ['Cada rodada sorteia um multiplicador.', 'A lua cheia paga até 8x.', 'Aposte com responsabilidade, mesmo em demo.'], play() { const multiplier = Number((1 + Math.random()*7).toFixed(1)); return { tiles: ['ROCKET', multiplier >= 6 ? 'FULL MOON' : 'MOON', 'COMET'], text: `O foguete chegou a x${multiplier}.`, multiplier: multiplier >= 6 ? multiplier : 0 }; } },
      'gem-forge': { title: 'Gem Forge', tagline: 'Combine cristais e acenda a forja.', mode: 'Grade de cristais', icons: ['SAPPHIRE','AMETHYST','EMERALD','FORGE'], rules: ['Três cristais iguais formam uma linha.', 'A forja acesa paga 5x.', 'Toda rodada é gerada localmente.'], play() { const gem = this.icons[Math.floor(Math.random()*3)]; const hit = Math.random() > .58; return { tiles: hit ? [gem,gem,gem] : [gem,this.icons[(this.icons.indexOf(gem)+1)%3],'SAPPHIRE'], text: hit ? 'Cristais alinhados! A forja brilhou.' : 'Os cristais precisam de outra combinação.', multiplier: hit ? 5 : 0 }; } },
      'rocket-rumble': { title: 'Rocket Rumble', tagline: 'Escolha uma rota e acelere.', mode: 'Escolha de rota', icons: ['ROCKET','ORBIT','BOOST','TROPHY'], rules: ['Uma rota segura aparece a cada rodada.', 'O planeta dourado paga 3x.', 'A nave vencedora é aleatória.'], play() { const win = Math.random() > .5; return { tiles: ['ROCKET', win ? 'TROPHY' : 'FIRE', win ? 'ORBIT' : 'CRASH'], text: win ? 'Rota estelar concluída! Vitória de 3x.' : 'A nave saiu da rota nesta rodada.', multiplier: win ? 3 : 0 }; } },
      'lucky-lantern': { title: 'Lucky Lantern', tagline: 'Acenda a lanterna da sorte.', mode: 'Sorteio de símbolos', icons: ['LANTERN','LUCK','BLOSSOM','COIN'], rules: ['Acenda três lanternas em sequência.', 'Três lanternas alinhadas pagam 6x.', 'Uma nova combinação é criada a cada clique.'], play() { const win = Math.random() > .62; return { tiles: win ? ['LANTERN','LANTERN','LANTERN'] : ['LANTERN','BLOSSOM','COIN'], text: win ? 'Lanternas alinhadas! Vitória de 6x.' : 'A sorte está se aquecendo.', multiplier: win ? 6 : 0 }; } }
    };
    const slug = new URLSearchParams(location.search).get('game') || 'neon-dice'; const game = games[slug] || games['neon-dice']; const requestedBet = Number(new URLSearchParams(location.search).get('bet')); let bet = Number.isFinite(requestedBet) && requestedBet > 0 ? Math.min(50, Math.max(1, requestedBet)) : 5; let balance = 250;
    const title = document.getElementById('title'); const board = document.getElementById('board'); const result = document.getElementById('result'); const balanceEl = document.getElementById('balance'); const betEl = document.getElementById('bet');
    title.textContent = game.title; document.title = `${game.title} | Jogo Alex`; document.getElementById('tagline').textContent = game.tagline; document.getElementById('mode').textContent = game.mode; document.getElementById('rules').innerHTML = game.rules.map(rule => `<li>${rule}</li>`).join('');
    function money(value) { return `R$ ${value.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`; }
    betEl.textContent = `Aposta: ${money(bet)}`;
    function setTileValue(tile, value) { tile.textContent = value; tile.style.backgroundImage = `linear-gradient(180deg, rgba(5, 12, 22, .06), rgba(5, 12, 22, .7)), url("${game.art}")`; }
    function buildBoard(initialTiles) { board.innerHTML = initialTiles.map((tile, index) => `<div class="tile idle-float" data-index="${index}"></div>`).join(''); const tiles = [...board.querySelectorAll('.tile')]; tiles.forEach((tile, index) => setTileValue(tile, initialTiles[index])); return tiles; }
    let tileEls = buildBoard(game.icons.slice(0, 3));
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // --- Som sintetizado via Web Audio API: nenhum arquivo externo, sem risco de direitos autorais. ---
    const SlotSound = (() => {
      let ctx = null;
      let muted = localStorage.getItem('jogo-alex-muted') === '1';
      const ensureContext = () => { if (!ctx) { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) ctx = new AudioCtx(); } if (ctx?.state === 'suspended') ctx.resume(); return ctx; };
      const tone = (freq, { duration = 0.15, type = 'sine', gain = 0.18, delay = 0 } = {}) => {
        if (muted) return;
        const audioCtx = ensureContext();
        if (!audioCtx) return;
        const start = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        gainNode.gain.setValueAtTime(gain, start);
        gainNode.gain.exponentialRampToValueAtTime(0.001, start + duration);
        osc.connect(gainNode).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      };
      return {
        toggleMute() { muted = !muted; localStorage.setItem('jogo-alex-muted', muted ? '1' : '0'); return muted; },
        isMuted: () => muted,
        unlock: () => ensureContext(),
        click: () => tone(520, { duration: 0.07, type: 'square', gain: 0.08 }),
        tileStop: (index) => tone(260 + index * 50, { duration: 0.09, type: 'triangle', gain: 0.16 }),
        win: (tier = 1) => { [523.25, 659.25, 783.99, 1046.5].slice(0, 2 + Math.min(tier, 2)).forEach((freq, i) => tone(freq, { duration: 0.28, type: 'sine', gain: 0.14, delay: i * 0.09 })); },
        bigWin: () => { [523.25, 659.25, 783.99, 987.77, 1174.66, 1567.98].forEach((freq, i) => tone(freq, { duration: 0.45, type: 'triangle', gain: 0.15, delay: i * 0.12 })); }
      };
    })();

    const muteToggle = document.getElementById('muteToggle');
    const updateSoundIcon = () => { muteToggle.textContent = SlotSound.isMuted() ? '🔇' : '🔊'; };
    updateSoundIcon();
    muteToggle.addEventListener('click', () => { SlotSound.unlock(); SlotSound.toggleMute(); updateSoundIcon(); });

    const fxLayer = document.getElementById('fxLayer');
    const bigWinOverlay = document.getElementById('bigWinOverlay');
    const bigWinAmount = document.getElementById('bigWinAmount');

    function spawnCoinParticles(tileEl, count = 5) {
      const rect = tileEl.getBoundingClientRect();
      for (let i = 0; i < count; i += 1) {
        const particle = document.createElement('div');
        particle.className = 'coin-particle';
        particle.textContent = Math.random() > 0.5 ? '🪙' : '✨';
        particle.style.left = `${rect.left + rect.width / 2}px`;
        particle.style.top = `${rect.top + rect.height / 2}px`;
        const angle = Math.random() * Math.PI * 2;
        const distance = 45 + Math.random() * 35;
        particle.style.setProperty('--fly', `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance - 35}px)`);
        fxLayer.appendChild(particle);
        setTimeout(() => particle.remove(), 950);
      }
    }

    function animateCount(el, from, to, duration = 500) {
      const start = performance.now();
      const step = (now) => {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - (1 - progress) ** 3;
        el.textContent = money(from + (to - from) * eased);
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function showBigWin(amount) {
      SlotSound.bigWin();
      bigWinAmount.textContent = money(amount);
      bigWinOverlay.classList.add('show');
      for (let i = 0; i < 14; i += 1) {
        setTimeout(() => spawnCoinParticles(tileEls[Math.floor(Math.random() * tileEls.length)], 1), i * 60);
      }
      setTimeout(() => bigWinOverlay.classList.remove('show'), 2200);
    }

    // Gira cada azulejo (com ícones do próprio jogo) e revela o resultado em cascata, como um caça-níquel de verdade.
    async function spinTiles(finalTiles) {
      tileEls.forEach((tile) => { tile.classList.remove('win', 'idle-float'); tile.classList.add('spinning'); });
      const pool = game.icons;
      const intervals = tileEls.map((tile) => setInterval(() => { setTileValue(tile, pool[Math.floor(Math.random() * pool.length)]); }, 70));

      for (const [index, tile] of tileEls.entries()) {
        await sleep(320 + index * 260);
        clearInterval(intervals[index]);
        tile.classList.remove('spinning');
        setTileValue(tile, finalTiles[index]);
        tile.classList.add('landing');
        setTimeout(() => tile.classList.remove('landing'), 460);
        SlotSound.tileStop(index);
      }

      tileEls.forEach((tile) => tile.classList.add('idle-float'));
    }

    document.getElementById('play').addEventListener('click', async () => {
      if (balance < bet) { result.innerHTML = '<strong>Saldo demo insuficiente.</strong>'; return; }

      SlotSound.unlock();
      SlotSound.click();
      const playButton = document.getElementById('play');
      playButton.disabled = true;

      const round = game.play();
      await spinTiles(round.tiles);

      const previousBalance = balance;
      balance = Number((balance - bet + bet * round.multiplier).toFixed(2));
      animateCount(balanceEl, previousBalance, balance);
      result.innerHTML = `<strong>${round.text}</strong><br>Saldo após a rodada: ${money(balance)}`;

      if (round.multiplier > 0) {
        await sleep(120);
        tileEls.forEach((tile) => { tile.classList.add('win'); spawnCoinParticles(tile, 3); });
        SlotSound.win(round.multiplier >= 5 ? 2 : 1);
      }

      if (round.multiplier >= 6) {
        await sleep(200);
        showBigWin(bet * round.multiplier);
      }

      playButton.disabled = false;
    });
    document.getElementById('betDown').addEventListener('click', () => { bet = Math.max(1, bet - 1); betEl.textContent = `Aposta: ${money(bet)}`; }); document.getElementById('betUp').addEventListener('click', () => { bet = Math.min(50, bet + 1); betEl.textContent = `Aposta: ${money(bet)}`; });
  </script>
</body>
</html>
