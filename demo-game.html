<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo Alex | Demo</title>
  <style>
    :root { --accent: #55e6c1; --accent-2: #ffc857; --bg: #08111f; --panel: rgba(15, 27, 45, .88); --line: rgba(148, 163, 184, .2); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f8fafc; font: 16px/1.5 Georgia, 'Times New Roman', serif; background: radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 35%), linear-gradient(145deg, #08111f, #111827 65%, #0a1724); }
    .shell { width: min(1060px, calc(100% - 32px)); margin: auto; padding: 28px 0 44px; }
    header, section { border: 1px solid var(--line); background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.22); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 24px; border-radius: 24px; border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .kicker { margin: 0; color: var(--accent); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; } h1 { margin-bottom: 6px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; color: var(--accent-2); } h2 { margin-bottom: 8px; font-size: 1.45rem; }
    .balance { min-width: 150px; padding: 12px 16px; border-radius: 14px; background: rgba(0,0,0,.22); text-align: right; } .balance span { display: block; color: #a8b6c8; font: 10px Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; } .balance strong { color: var(--accent); font: 700 1.35rem Arial, sans-serif; }
    main { display: grid; grid-template-columns: 1.35fr .8fr; gap: 18px; margin-top: 18px; } section { padding: 24px; border-radius: 24px; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0; } .tile { aspect-ratio: 1; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: 16px; background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(0,0,0,.2)); font-size: clamp(2rem, 8vw, 4rem); box-shadow: inset 0 -12px 24px rgba(0,0,0,.14); }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; } button { border: 0; border-radius: 12px; padding: 12px 18px; color: #06131a; background: var(--accent); font-weight: 700; cursor: pointer; } button.secondary { color: #f8fafc; background: rgba(255,255,255,.08); border: 1px solid var(--line); } button:disabled { opacity: .65; cursor: wait; }
    .result { min-height: 72px; display: grid; align-content: center; margin-top: 18px; padding: 14px; border-left: 3px solid var(--accent-2); background: rgba(255,255,255,.05); } .result strong { color: var(--accent-2); } .rules { color: #b8c4d4; } .rules li { margin: 10px 0; } .back { display: inline-block; margin-top: 20px; color: var(--accent); text-decoration: none; font: 700 14px Arial, sans-serif; }
    @media (max-width: 720px) { header { align-items: flex-start; flex-direction: column; } .balance { text-align: left; } main { grid-template-columns: 1fr; } section { padding: 18px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><div><p class="kicker">Jogo Alex · demonstração</p><h1 id="title">Demo</h1><p id="tagline">Uma experiência original para explorar.</p></div><div class="balance"><span>Saldo fictício</span><strong id="balance">R$ 250,00</strong></div></header>
    <main><section><p class="kicker">Rodada rápida</p><h2 id="boardTitle">Prepare sua jogada</h2><div class="board" id="board"></div><div class="controls"><button id="play">Jogar demo</button><button class="secondary" id="betDown">− Aposta</button><button class="secondary" id="betUp">+ Aposta</button><span id="bet">Aposta: R$ 5,00</span></div><div class="result" id="result">Escolha uma jogada para começar.</div></section><section><p class="kicker">Como funciona</p><h2 id="mode">Modo demo</h2><ul class="rules" id="rules"></ul><a class="back" href="index.html">← Voltar ao catálogo</a></section></main>
  </div>
  <script>
    const games = {
      'neon-dice': { title: 'Neon Dice', tagline: 'Dois dados, uma combinação elétrica.', mode: 'Duelo de dados', icons: ['⚡','🎲','7️⃣','💎'], rules: ['Lance dois dados neon.', 'Duplas pagam até 4x a aposta.', 'O 7 dourado paga 7x.'], play() { const a = Math.floor(Math.random()*6)+1; const b = Math.floor(Math.random()*6)+1; return { tiles: [`${a}`, `${b}`, a+b === 7 ? '🌟' : '⚡'], text: a+b === 7 ? 'Sete dourado! Vitória de 7x.' : a === b ? 'Dupla neon! Vitória de 4x.' : 'A combinação não fechou nesta rodada.', multiplier: a+b === 7 ? 7 : a === b ? 4 : 0 }; } },
      'moon-crash': { title: 'Moon Crash', tagline: 'Suba até a lua antes da queda.', mode: 'Multiplicador crescente', icons: ['🚀','🌙','☄️','✨'], rules: ['Cada rodada sorteia um multiplicador.', 'A lua cheia paga até 8x.', 'Aposte com responsabilidade, mesmo em demo.'], play() { const multiplier = Number((1 + Math.random()*7).toFixed(1)); return { tiles: ['🚀', multiplier >= 6 ? '🌕' : '🌙', '☄️'], text: `O foguete chegou a x${multiplier}.`, multiplier: multiplier >= 6 ? multiplier : 0 }; } },
      'gem-forge': { title: 'Gem Forge', tagline: 'Combine cristais e acenda a forja.', mode: 'Grade de cristais', icons: ['🔷','🟣','🟢','🔥'], rules: ['Três cristais iguais formam uma linha.', 'A forja acesa paga 5x.', 'Toda rodada é gerada localmente.'], play() { const gem = this.icons[Math.floor(Math.random()*3)]; const hit = Math.random() > .58; return { tiles: hit ? [gem,gem,gem] : [gem,this.icons[(this.icons.indexOf(gem)+1)%3],'🔷'], text: hit ? 'Cristais alinhados! A forja brilhou.' : 'Os cristais precisam de outra combinação.', multiplier: hit ? 5 : 0 }; } },
      'rocket-rumble': { title: 'Rocket Rumble', tagline: 'Escolha uma rota e acelere.', mode: 'Escolha de rota', icons: ['🚀','🪐','🔥','🏆'], rules: ['Uma rota segura aparece a cada rodada.', 'O planeta dourado paga 3x.', 'A nave vencedora é aleatória.'], play() { const win = Math.random() > .5; return { tiles: ['🚀', win ? '🏆' : '🔥', win ? '🪐' : '💥'], text: win ? 'Rota estelar concluída! Vitória de 3x.' : 'A nave saiu da rota nesta rodada.', multiplier: win ? 3 : 0 }; } },
      'lucky-lantern': { title: 'Lucky Lantern', tagline: 'Acenda a lanterna da sorte.', mode: 'Sorteio de símbolos', icons: ['🏮','🧧','🌸','🪙'], rules: ['Acenda três lanternas em sequência.', 'O envelope vermelho paga 6x.', 'Uma nova combinação é criada a cada clique.'], play() { const win = Math.random() > .62; return { tiles: win ? ['🏮','🏮','🏮'] : ['🏮','🌸','🪙'], text: win ? 'Lanternas alinhadas! Vitória de 6x.' : 'A sorte está se aquecendo.', multiplier: win ? 6 : 0 }; } }
    };
    const slug = new URLSearchParams(location.search).get('game') || 'neon-dice'; const game = games[slug] || games['neon-dice']; let bet = 5; let balance = 250;
    const title = document.getElementById('title'); const board = document.getElementById('board'); const result = document.getElementById('result'); const balanceEl = document.getElementById('balance'); const betEl = document.getElementById('bet');
    title.textContent = game.title; document.title = `${game.title} | Jogo Alex`; document.getElementById('tagline').textContent = game.tagline; document.getElementById('mode').textContent = game.mode; document.getElementById('rules').innerHTML = game.rules.map(rule => `<li>${rule}</li>`).join('');
    function render(tiles) { board.innerHTML = tiles.map(tile => `<div class="tile">${tile}</div>`).join(''); } function money(value) { return `R$ ${value.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`; } render(game.icons.slice(0,3));
    document.getElementById('play').addEventListener('click', () => { if (balance < bet) { result.innerHTML = '<strong>Saldo demo insuficiente.</strong>'; return; } const round = game.play(); balance = Number((balance - bet + bet * round.multiplier).toFixed(2)); render(round.tiles); balanceEl.textContent = money(balance); result.innerHTML = `<strong>${round.text}</strong><br>Saldo após a rodada: ${money(balance)}`; });
    document.getElementById('betDown').addEventListener('click', () => { bet = Math.max(1, bet - 1); betEl.textContent = `Aposta: ${money(bet)}`; }); document.getElementById('betUp').addEventListener('click', () => { bet = Math.min(50, bet + 1); betEl.textContent = `Aposta: ${money(bet)}`; });
  </script>
</body>
</html>
